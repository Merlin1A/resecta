# Pull-request gate; also runs on every push to main. Builds the app and
# its unit- and UI-test bundles without running them, runs the audit lint
# over the lines the change adds and the claims lint over the shipping
# docs and the view-layer strings, checks the documented counts against
# the tree, checks the shipped-asset hashes, fails when a source file
# already over 800 lines grows (the growth ratchet) and reports the
# silent-guard census over the three test trees. The scripts run
# from the base branch's copies, so a change cannot edit the lint it is
# gated by; the change's own copies run once more, report-only. About five
# minutes on a hosted macos-26 runner. The batched simulator suites
# (sim-suite.yml) run weekly, on demand and on release tags, and the app
# suite on every pull request to main as a non-required check; the engine
# host suite (engine-suite.yml) runs on demand only. Neither runs here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  XCODEGEN_VERSION: 2.45.3
  XCODEGEN_SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878

jobs:
  pr-gate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: XcodeGen (pinned release, digest-checked)
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "${RUNNER_TEMP}/xcodegen"
          echo "${RUNNER_TEMP}/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/xcodegen/xcodegen/bin/xcodegen" --version

      - name: Generate the project
        run: ./regenerate.sh

      - name: Build the app
        run: |
          t0=$SECONDS
          xcodebuild build \
            -project ResectaApp.xcodeproj -scheme ResectaApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
          echo "BUILD_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      - name: Build the test bundles
        run: |
          t0=$SECONDS
          xcodebuild build-for-testing \
            -project ResectaApp.xcodeproj -scheme ResectaApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
          echo "BFT_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      # The copies sit one directory under the checkout because two of the
      # scripts locate the tree relative to their own path. audit-lint.sh
      # runs the silent-guard scanner that sits beside it, so the scanner is
      # copied too. On a push to main the base is HEAD~1: for a merge commit,
      # the scripts main carried before the merge.
      - name: Lint scripts from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="origin/${BASE_REF}"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          dir="${GITHUB_WORKSPACE}/.base-scripts"
          mkdir -p "$dir"
          for s in claims-lint.sh doc-metrics.sh audit-lint.sh verify-shipped-asset-hashes.sh lint-silent-guards.py; do
            git show "${base}:Scripts/${s}" > "${dir}/${s}"
            chmod +x "${dir}/${s}"
          done
          echo "lint scripts from ${base} = $(git rev-parse "$base")"
          echo "BASE_SCRIPTS=${dir}" >> "$GITHUB_ENV"
          echo "LINT_SCRIPTS_FROM=${base} $(git rev-parse --short "$base")" >> "$GITHUB_ENV"

      - name: Claims lint
        run: |
          t0=$SECONDS
          "${BASE_SCRIPTS}/claims-lint.sh"
          echo "CLAIMS_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      - name: Documented counts
        run: |
          t0=$SECONDS
          "${BASE_SCRIPTS}/doc-metrics.sh" --check
          echo "DOCMETRICS_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      - name: Audit lint over the change
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          t0=$SECONDS
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
            echo "no event base (first push or unknown event); using HEAD~1 = $base"
          fi
          echo "audit-lint range: ${base}..HEAD"
          "${BASE_SCRIPTS}/audit-lint.sh" --range "${base}..HEAD"
          echo "AUDIT_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      - name: Shipped-asset hash fence
        run: |
          "${BASE_SCRIPTS}/verify-shipped-asset-hashes.sh"

      # The silent-guard census over the three test trees (report-only): the
      # per-target SILENT and NO-ASSERT counts and the inventory behind them,
      # in the log and the step summary. The audit lint above gates the guard
      # lines a change adds (AL-5); the census shows the whole tree, so a
      # test that can pass without asserting is visible on every pull request.
      - name: Silent-guard census (report-only)
        continue-on-error: true
        run: |
          rc=0
          python3 "${BASE_SCRIPTS}/lint-silent-guards.py" --census "$GITHUB_WORKSPACE" > census.log || rc=$?
          cat census.log
          {
            echo "## silent-guard census"
            echo
            echo '```'
            sed -n '/^TEST-TARGET MAP/,/^SILENT total/p' census.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || echo "::warning::silent-guard census: a silent test is in the tree (see the inventory in the log)"
          exit "$rc"

      # Growth ratchet: a source file over 800 lines at the base of the change
      # may not be larger at its head (Scripts/growth-ratchet.sh; a split along
      # a real seam shrinks the file and passes). Enforcing: with
      # RATCHET_ENFORCE at '1' a grown file is an error annotation and fails
      # the gate; every tracked file is listed in the step summary. Runs the
      # base branch's copy of the script when the base has one, this change's
      # copy on its first landing.
      - name: Growth ratchet
        env:
          RATCHET_ENFORCE: '1'
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          t0=$SECONDS
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          script="${BASE_SCRIPTS}/growth-ratchet.sh"
          if git show "${base}:Scripts/growth-ratchet.sh" > "$script" 2>/dev/null && [ -s "$script" ]; then
            chmod +x "$script"
          else
            script="Scripts/growth-ratchet.sh"
            echo "growth-ratchet.sh is absent at ${base}; running this change's copy"
          fi
          echo "growth-ratchet range: ${base}..HEAD"
          "$script" "$base" HEAD
          echo "RATCHET_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"

      # The change's own copies of the four scripts, so an edit to a lint is
      # exercised before it merges. Never gates.
      - name: Lint scripts from this change (report-only)
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          rc=0
          Scripts/claims-lint.sh || { echo "::warning::this change's claims-lint.sh failed"; rc=1; }
          Scripts/doc-metrics.sh --check || { echo "::warning::this change's doc-metrics.sh --check failed"; rc=1; }
          Scripts/audit-lint.sh --range "${base}..HEAD" || { echo "::warning::this change's audit-lint.sh failed"; rc=1; }
          Scripts/verify-shipped-asset-hashes.sh || { echo "::warning::this change's verify-shipped-asset-hashes.sh failed"; rc=1; }
          exit "$rc"

      - name: Summary
        if: always()
        run: |
          {
            echo "## pr-gate"
            echo
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| xcodebuild build | ${BUILD_SECS:-—} |"
            echo "| xcodebuild build-for-testing | ${BFT_SECS:-—} |"
            echo "| claims-lint | ${CLAIMS_SECS:-—} |"
            echo "| doc-metrics (check) | ${DOCMETRICS_SECS:-—} |"
            echo "| audit-lint (range) | ${AUDIT_SECS:-—} |"
            echo "| growth-ratchet | ${RATCHET_SECS:-—} |"
            echo
            echo "lint scripts from: ${LINT_SCRIPTS_FROM:-—}"
          } >> "$GITHUB_STEP_SUMMARY"
