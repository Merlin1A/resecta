# Stops the runs still going for a pull request that is closed without
# being merged. Each job below joins the concurrency group of one
# pull-request workflow (ci.yml, sim-suite.yml) with cancel-in-progress,
# which cancels that workflow's run for the same pull request; the job
# itself does nothing. Without this a closed pull request's simulator
# suite keeps a macOS runner for up to twenty minutes while the next pull
# request's gate waits for one. A MERGED pull request's runs are left to
# finish: its gate has already passed (the check is required), and its
# simulator suite only reaches a verdict if it is allowed to run to the
# end — a run cancelled at the merge leaves no verdict anywhere, since
# sim-suite.yml does not run on pushes to main. The group names here must
# match the two workflows' `concurrency.group` lines. Linux runners, no
# token permissions, no checkout. Code scanning's runs are not reached
# from here.
name: pr-closed

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  stop-ci:
    if: ${{ !github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: ci-refs/pull/${{ github.event.pull_request.number }}/merge
      cancel-in-progress: true
    steps:
      - run: echo "the pull request is closed without a merge; its ci run, if one was going, is cancelled"

  stop-sim-suite:
    if: ${{ !github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: sim-suite-${{ github.event.pull_request.number }}-both
      cancel-in-progress: true
    steps:
      - run: echo "the pull request is closed without a merge; its sim-suite run, if one was going, is cancelled"
