# The batched simulator suites (Scripts/test-batched.sh <scheme>) on a
# hosted runner of the xcode-27 image, built with Xcode 27.2 (the release's
# Xcode, pinned by path below): build once, then serial suite-level batches
# on an iPhone 17 simulator under a watchdog, perf suites alone and
# report-only. Each job runs one scheme on one iOS major: 27 (the newest
# iOS 27 runtime on the image) or 26 (the deployment floor's leg, on an
# iOS 26.1 runtime the job downloads). Every Monday and on release tags,
# both schemes run on both majors, four jobs, and the iOS 27 ResectaApp job
# also runs the UI-test target serially (Scripts/test-batched.sh
# ResectaAppUI); a dispatch runs the scheme and major it names, with the UI
# suites when asked; ResectaApp on iOS 27 alone runs on every pull request
# to main as a required check (twenty to forty minutes),
# documentation-only pull requests included: its honesty tests read the
# README, ENGINEERING, THREAT-MODEL, PRIVACY and EULA text.
# RedactionEngine here runs the engine package's suites on the simulator
# (the package's one hosted run: a host `swift test` of the whole package
# never reached a verdict on a hosted runner) and stays off pull requests
# for its length. The runner takes its simulator by id and its
# DerivedData path from the environment set below.
#
# The account runs at most five macOS jobs at once, and every push to a
# pull request starts three of them (the ci.yml gate, this workflow's
# ResectaApp job and code scanning's Swift analysis): a fourth job on the
# same account waits for a slot. The weekly and tag runs add the engine
# job and the egress pins step below; a dispatch adds one job.
#
# The hosted runner is a three-vCPU virtual machine without Neural Engine
# access (the engine logs "E5RTNetwork: unable to compile network" there),
# and a full pipeline run's verification pass over the rasterized output
# never returns on it, and neither does the engine's OCR sweep or re-check
# over rasterized pages: 900 seconds of silence with no output, and the
# test's own time limit cannot end a hang inside a system framework. The
# eight suites that run such a pass, and three ink-fit timing pins, are left
# out on this runtime (TEST_BATCHED_EXCLUDE below; counted on every totals
# line and named in the log; the pre-push hook runs them on a push that
# needs their scheme), the runner's stall watchdog
# is widened (TEST_BATCHED_STALL_SECS) for the OCR-heavy tests that merely
# run slowly here, and a recovery reboots the simulator instead of erasing
# it.
name: sim-suite

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Test scheme for the batched runner
        type: choice
        options: [ResectaApp, RedactionEngine]
        default: ResectaApp
      ios:
        description: iOS major of the simulator (26 downloads the iOS 26.1 runtime)
        type: choice
        options: ['27', '26']
        default: '27'
      ui:
        description: Also run the UI-test target serially (ResectaApp only)
        type: boolean
        default: false
  # KEEP-ALIVE: GitHub disables a scheduled workflow after sixty days
  # without repository activity (a commit inside that window keeps it
  # running); a disabled workflow is re-enabled by hand in the Actions
  # tab.
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sim-suite-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scheme || 'both' }}-${{ inputs.ios || 'all' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  XCODEGEN_VERSION: 2.45.3
  XCODEGEN_SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878
  # The release's Xcode by path, never the image's default (27.1); see
  # ci.yml for the release-candidate note and the pin check.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  sim-suite:
    # The iOS 27 jobs keep the plain name, so the pull-request job is still
    # the required check `sim-suite (ResectaApp)`.
    name: sim-suite (${{ matrix.scheme }}${{ matrix.ios == '26' && ', iOS 26' || '' }})
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('[{{"scheme":"{0}","ios":"{1}"}}]', inputs.scheme || 'ResectaApp', inputs.ios || '27')) || github.event_name == 'pull_request' && fromJSON('[{"scheme":"ResectaApp","ios":"27"}]') || fromJSON('[{"scheme":"ResectaApp","ios":"27"},{"scheme":"RedactionEngine","ios":"27"},{"scheme":"ResectaApp","ios":"26"},{"scheme":"RedactionEngine","ios":"26"}]') }}
    env:
      SCHEME: ${{ matrix.scheme }}
      IOS_MAJOR: ${{ matrix.ios }}
      # Seconds of no output before the batched runner kills an invocation
      # (the local default is 180). See the header.
      TEST_BATCHED_STALL_SECS: '900'
      # Suites not run on this runtime: a full pipeline run's verification
      # pass, and the engine's OCR sweep and re-check over rasterized pages,
      # hang on the hosted virtual machine (see the header), and a test's
      # own time limit cannot end a hang inside a system framework. The
      # runner leaves them out, counts them on the totals line and names them
      # in the log; the pre-push hook runs them on a push that needs their
      # scheme.
      # Added 2026-10-21: the engine job's batch 6 stalled on 2026-10-12,
      # 2026-10-19 and a dispatched run on 2026-10-21 (no output for 900 s,
      # every test in the batch left open). The same suites were open each
      # time; the two that call Vision directly, OCREngineTests and
      # OCRCacheCoherenceTests, are left out here with the 12-page, 12-layer
      # searchable preflight (PacketSearchableProbeTests).
      # Added 2026-10-26: two ink-fit timing pins, PageImageInkFitTests (the
      # whole suite, with its stall and shade extensions) and
      # InkFitBusyPoolTests, judge the pool's release in seconds and fail
      # here while their behaviour holds (the stalled page's fit held
      # 2.3–4.0 s against a 1.5 s limit; a cancelled search returning after
      # 11 s against 0.5 s) on the weekly run at 10ab90dd and on the v1.3.0
      # tag run and its re-run; they pass on the pre-push hook's local run.
      # Left out here until the pins judge gates, not a clock.
      # Added 2026-10-29: PageImageInkFitStallTests, the stalled-lane pin
      # moved out of PageImageInkFitTests into a suite of its own (the
      # runner runs it alone, still gating), stays left out with it.
      # Owner of the 2026-10-26 and 2026-10-29 entries: Merlin1A. They end
      # when the pins judge gates, not a clock, or at the review on
      # 2027-01-31, whichever comes first.
      TEST_BATCHED_EXCLUDE: ${{ matrix.scheme == 'ResectaApp' && 'PipelineCoordinatorSecurityTests PageParallelRasterizationTests' || 'PacketOCRQualityRoleTests SearchRecheckOCRTests SearchRecheckParallelismTests PacketSearchableProbeTests OCREngineTests OCRCacheCoherenceTests PageImageInkFitTests PageImageInkFitStallTests InkFitBusyPoolTests' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: XcodeGen (pinned release, digest-checked)
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "${RUNNER_TEMP}/xcodegen"
          echo "${RUNNER_TEMP}/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        run: ./regenerate.sh

      - name: Toolchain
        run: |
          xcodebuild -version
          pin=0
          Scripts/toolchain-pin-check.sh --xcode || pin=$?
          if [ "$pin" -ne 0 ]; then
            echo "::warning::the Xcode that ran is not the release's pinned build (Scripts/toolchain-pin-check.sh --print-pin)"
          fi

      # The xcode-27 image carries iOS 27 runtimes only. The floor leg (iOS
      # 26) downloads iOS 26.1, the floor leg's runtime of record, and makes
      # an iPhone 17 on it when the download made none.
      - name: Simulator runtime (iOS ${{ matrix.ios }})
        run: |
          xcrun simctl list runtimes
          if [ "$IOS_MAJOR" = "26" ]; then
            if xcrun simctl list runtimes | /usr/bin/grep -q '^iOS 26\.1 '; then
              echo "iOS 26.1 runtime present; no download"
            else
              echo "downloading the iOS 26.1 runtime"
              t0=$SECONDS
              xcodebuild -downloadPlatform iOS -buildVersion 26.1
              echo "runtime download: $((SECONDS - t0)) s"
              xcrun simctl list runtimes
            fi
            rt=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("version", "").startswith("26.1")]
          print(rs[0]["identifier"] if rs else "")
          ')
            [ -n "$rt" ] || { echo "::error::no available iOS 26.1 runtime after the download"; exit 1; }
            if ! xcrun simctl list devices available -j | python3 -c '
          import json, sys
          sys.exit(0 if any(d["name"] == "iPhone 17" for d in json.load(sys.stdin)["devices"].get(sys.argv[1], [])) else 1)
          ' "$rt"; then
              xcrun simctl create "iPhone 17" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$rt"
            fi
          fi
          xcrun simctl list devices available | /usr/bin/grep 'iPhone 17' || true

      # A cold first boot on a 3-vCPU runner takes longer than the batched
      # runner's 180-second no-output watchdog, which then kills the first
      # invocation and erases the device; boot once here and wait for it.
      # The runner does not resolve simulators by name: the id found here is
      # exported as TEST_BATCHED_SIM_UDID (the job fails when none exists).
      # The iPhone 17 on the newest runtime of the job's iOS major.
      - name: Boot the simulator
        run: |
          read -r udid runtime < <(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          major = int(os.environ["IOS_MAJOR"])
          best = None
          for runtime, devs in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)$", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              if ver[0] != major:
                  continue
              for d in devs:
                  if d["name"] != "iPhone 17":
                      continue
                  if best is None or ver > best[0]:
                      best = (ver, d["udid"], runtime)
          if best is None:
              sys.exit("no iPhone 17 simulator on iOS %d" % major)
          print(best[1], best[2])
          ')
          [ -n "$udid" ] || { echo "::error::no iPhone 17 simulator on iOS $IOS_MAJOR"; exit 1; }
          echo "booting $udid ($runtime)"
          { echo "## simulator"; echo; echo "iPhone 17 \`$udid\` on \`$runtime\`"; } >> "$GITHUB_STEP_SUMMARY"
          t0=$SECONDS
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "boot: $((SECONDS - t0)) s"
          echo "TEST_BATCHED_SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "TEST_BATCHED_DD=${RUNNER_TEMP}/dd" >> "$GITHUB_ENV"

      - name: Batched suite
        run: |
          t0=$SECONDS
          rc=0
          Scripts/test-batched.sh "$SCHEME" --timeout-mins 25 2>&1 | tee batched.log || rc=$?
          echo "SUITE_SECS=$((SECONDS - t0))" >> "$GITHUB_ENV"
          echo "SUITE_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      # The UI-test target, serially (one suite per invocation, the same
      # watchdog and verdict file), on the iOS 27 ResectaApp job of the
      # weekly and tag runs and on a dispatch that asks for it; never on a
      # pull request (a macOS slot). A red suite fails the job. The build is
      # the bundles the unit run built (the same DerivedData).
      - name: UI suites
        if: ${{ !cancelled() && matrix.scheme == 'ResectaApp' && matrix.ios == '27' && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ui)) }}
        run: |
          t0=$SECONDS
          rc=0
          Scripts/test-batched.sh ResectaAppUI --timeout-mins 25 2>&1 | tee ui-batched.log || rc=$?
          {
            echo "## UI suites (ResectaAppUI)"
            echo
            echo "- wall: $((SECONDS - t0)) s · rc: $rc"
            echo
            echo '```'
            /usr/bin/grep -E '^VERDICT:|^totals:|^OFFENDERS:' ui-batched.log || echo "(no verdict line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The editor's link-policy pins (Tests/ResectaAppUITests/
      # DocumentLinkUITests.swift) drive the built app and assert that a
      # tapped link annotation does not leave the app. On the iOS 27 job
      # they run inside the UI suites above; on the iOS 26 floor job of the
      # weekly and tag runs they run here alone (never on a pull request: a
      # macOS slot), against the bundles the runner already built and the
      # simulator it used.
      - name: Egress UI pins
        if: ${{ !cancelled() && matrix.scheme == 'ResectaApp' && matrix.ios == '26' && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          t0=$SECONDS
          rc=0
          xcodebuild test-without-building -scheme ResectaApp \
            -destination "id=$TEST_BATCHED_SIM_UDID" -derivedDataPath "$TEST_BATCHED_DD" \
            -resultBundlePath "$RUNNER_TEMP/egress-ui-pins.xcresult" \
            -only-testing:ResectaAppUITests/DocumentLinkUITests 2>&1 \
            | /usr/bin/grep -vE 'attributedStringScaled' | tee egress-ui-pins.log || rc=$?
          {
            echo "## egress UI pins (DocumentLinkUITests)"
            echo
            echo "- wall: $((SECONDS - t0)) s · rc: $rc"
            echo
            echo '```'
            /usr/bin/grep -E "Test Case '-\[.*\]' (passed|failed)|Executed [0-9]+ tests?" egress-ui-pins.log | tail -n 6 || echo "(no test lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Collect logs and failing result bundles
        if: always()
        run: |
          mkdir -p upload
          cp batched.log ui-batched.log upload/ 2>/dev/null || true
          # The scheme's run dir, and the UI suites' run dir when they ran
          # (its logs and bundles go under upload/ui/).
          for mode in "$SCHEME" ResectaAppUI; do
            run_dir=""
            for d in /tmp/test-batched-"$mode"-*/; do
              if [ -d "$d" ]; then run_dir="${d%/}"; fi
            done
            [ -n "$run_dir" ] || continue
            out=upload
            [ "$mode" = ResectaAppUI ] && out=upload/ui
            mkdir -p "$out"
            cp "$run_dir"/*.log "$run_dir"/*.txt "$out"/ 2>/dev/null || true
            if [ -s "$run_dir/failures.txt" ]; then
              awk '{print $2}' "$run_dir/failures.txt" | sort -u | while read -r label; do
                for xc in "$run_dir/$label".xcresult "$run_dir/$label"-r*.xcresult; do
                  if [ -d "$xc" ]; then cp -R "$xc" "$out"/; fi
                done
              done
            fi
          done
          du -sh upload
          {
            echo "## sim-suite ($SCHEME, iOS $IOS_MAJOR)"
            echo
            echo "- wall: ${SUITE_SECS:-—} s · rc: ${SUITE_RC:-—}"
            echo
            echo '```'
            /usr/bin/grep -E '^simulator:|^VERDICT:|^totals:|^OFFENDERS:|non-gating reds' batched.log || echo "(no verdict line)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Result bundles are uploadable only because the corpus is synthetic and frozen; never point this workflow at a real document.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-suite-logs-${{ matrix.scheme }}-ios${{ matrix.ios }}
          path: upload
          retention-days: 14
          if-no-files-found: warn

  # A scheduled or tag run that fails leaves an annotation and a step
  # summary; when the repository variable NTFY_TOPIC is set, the run's URL
  # is also posted to that ntfy topic. A variable, not a secret: the public
  # repositories carry no Actions secrets, and the topic is masked in the
  # log and never printed. The body names the repository, the workflow and
  # the run; no test name and no finding. Linux runner, no macOS slot.
  failure-notice:
    needs: sim-suite
    if: ${{ failure() && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          echo "::error::sim-suite failed on ${GITHUB_EVENT_NAME} (${GITHUB_REF_NAME}): ${RUN_URL}"
          {
            echo "## failure notice"
            echo
            echo "- sim-suite failed on ${GITHUB_EVENT_NAME} (${GITHUB_REF_NAME}): ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$NTFY_TOPIC" ]; then
            echo "::add-mask::$NTFY_TOPIC"
            curl -fsS --max-time 20 \
              -d "${GITHUB_REPOSITORY} · sim-suite failed on ${GITHUB_EVENT_NAME} · ${RUN_URL}" \
              "https://ntfy.sh/${NTFY_TOPIC}" || echo '::warning::the notice was not delivered'
          else
            echo "NTFY_TOPIC is not set; the annotation and the step summary are the notice"
          fi
